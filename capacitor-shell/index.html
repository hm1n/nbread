<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>엔빵</title>
    <style>
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #fffaf2;
        color: #2c2118;
        font-family: system-ui, sans-serif;
      }
      main {
        width: min(360px, calc(100% - 48px));
        text-align: center;
      }
      p {
        color: #6f6258;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>엔빵에 연결할 수 없어요</h1>
      <p>인터넷 연결을 확인한 뒤 앱을 다시 열어 주세요.</p>
    </main>
  </body>
</html>
